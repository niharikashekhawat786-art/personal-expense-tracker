{% extends "base.html" %}
{% block title %}Create account · Expense Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">LET'S GET STARTED</span>
    <h1 class="h2 fw-bold mt-2">Create your account</h1>
    <p class="text-secondary">Your expense data will be kept separate from other accounts in this app.</p>
    <form method="post" class="mt-4">
      <div class="mb-3"><label for="name" class="form-label">Full name</label><input id="name" name="name" class="form-control form-control-lg" value="{{ name|default('') }}" maxlength="80" required autocomplete="name"></div>
      <div class="mb-3"><label for="email" class="form-label">Email address</label><input id="email" name="email" type="email" class="form-control form-control-lg" value="{{ email|default('') }}" required autocomplete="email"></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control form-control-lg" minlength="8" required autocomplete="new-password"><div class="form-text">Use at least 8 characters.</div></div>
      <div class="mb-3"><label for="confirm_password" class="form-label">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" class="form-control form-control-lg" minlength="8" required autocomplete="new-password"></div>
      <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Create account</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
