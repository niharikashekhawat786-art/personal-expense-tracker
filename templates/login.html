{% extends "base.html" %}
{% block title %}Log in · Expense Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">WELCOME BACK</span>
    <h1 class="h2 fw-bold mt-2">Log in</h1>
    <p class="text-secondary">Continue managing your personal expenses.</p>
    <form method="post" class="mt-4">
      <div class="mb-3"><label for="email" class="form-label">Email address</label><input id="email" name="email" type="email" class="form-control form-control-lg" required autocomplete="email"></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control form-control-lg" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Log in</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
